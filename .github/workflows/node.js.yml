# Installs and builds each sub-project (FRONTEND, NODEAPI) on every push and pull request to master,
# so dependency updates are actually exercised before they are merged.
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-nodejs

name: Node.js CI

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend build (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest

    strategy:
      matrix:
        # Vite 8 requires Node 20.19+ / 22.12+, and Node 20 is end-of-life, so test the current LTS lines.
        # See supported Node.js release schedule at https://nodejs.org/en/about/releases/
        node-version: [22.x, 24.x]

    defaults:
      run:
        working-directory: FRONTEND

    steps:
    - uses: actions/checkout@v4
    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'
        cache-dependency-path: FRONTEND/package-lock.json
    - run: npm ci
    - run: npm run build

  api:
    name: API smoke test (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [22.x, 24.x]

    defaults:
      run:
        working-directory: NODEAPI

    steps:
    - uses: actions/checkout@v4
    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'
        cache-dependency-path: NODEAPI/package-lock.json
    - run: npm ci
    - name: Syntax check server entry point
      run: node --check server.js
    # server.js connects to MongoDB and starts listening when loaded, so instead load everything it wires up
    # (dotenv, express, mongoose, cors, routes -> controllers -> models, middleware) without starting it.
    - name: Load API modules
      run: >-
        node -e "
        for (const m of ['dotenv', 'express', 'mongoose', 'cors',
        './routes/customerRoute', './routes/taxRoute', './routes/invoiceRoute',
        './middlewares/errorMiddleware']) require(m);
        console.log('API modules loaded OK');
        "
