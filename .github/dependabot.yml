# Dependabot version updates, InvoiceMe.
# Minor and patch bumps are grouped into ONE pull request per ecosystem, so the
# ruleset's "branch must be up to date" rule only has to be satisfied once
# instead of once per dependency. Major bumps are not grouped: each one stays
# its own PR so it gets its own review.
# Docs: https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2
updates:
  # Frontend (Vite) and backend (Node API) share one grouped PR
  - package-ecosystem: "npm"
    directories:
      - "/FRONTEND"
      - "/NODEAPI"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      # Security updates for any npm dependency, in one PR
      npm-security:
        applies-to: security-updates
        patterns:
          - "*"
      # Routine minor/patch bumps, in one PR
      npm-minor-patch:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  # GitHub Actions updates
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 5
    groups:
      actions-minor-patch:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
